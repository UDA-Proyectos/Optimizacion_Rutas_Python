services:
  postgres:
    image: postgres:16-alpine
    container_name: vrp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OSRM propio (perfil driving, MLD) con los datos que prepara
  # `scripts/preparar_osrm.py`. Va en un profile para que un `docker compose up -d`
  # sin datos preparados no deje un contenedor reiniciándose:
  #   docker compose --profile osrm up -d osrm
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: vrp_osrm
    profiles: ["osrm"]
    restart: unless-stopped
    # El default de --max-table-size es 100 ubicaciones; una ruta larga lo supera.
    command: osrm-routed --algorithm mld --max-table-size 300 /data/mendoza.osrm
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "${OSRM_PORT:-5001}:5000"

volumes:
  postgres_data:
